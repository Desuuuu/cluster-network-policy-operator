version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - goconst
    - gocyclo
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
